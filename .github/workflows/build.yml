name: Build Vita + PC test

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: publish a release with this version tag (e.g. v1.0); empty for a plain build
        default: ""

# builds on main run one at a time, so each release gets the next version number
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the version this build would be released as: the latest release plus one (v1.0 -> v1.1), or the
  # one typed in Run workflow; the Vita app version (param.sfo) follows it: v1.1 -> 01.01
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      app: ${{ steps.v.outputs.app }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.release }}
        run: |
          last=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name 2>/dev/null || echo v1.0)
          if [ -n "$WANT" ]; then tag="$WANT"; else
            maj=$(echo "${last#v}" | cut -d. -f1); min=$(echo "${last#v}" | cut -d. -f2)
            tag="v$maj.$((min + 1))"
          fi
          maj=$(echo "${tag#v}" | cut -d. -f1); min=$(echo "${tag#v}" | cut -d. -f2)
          app=$(printf "%02d.%02d" "$maj" "${min:-0}")
          echo "last release $last, this build $tag (app $app)"
          echo "tag=$tag" >> $GITHUB_OUTPUT; echo "app=$app" >> $GITHUB_OUTPUT

  vita:
    needs: version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: |
          (apk add --no-cache git cmake make bash python3 2>/dev/null || (apt-get update && apt-get install -y git cmake make python3)) || true
          ls $VITASDK/arm-vita-eabi/lib | grep -i -E "vitagl|vitashark|mathneon|ShaccCgExt" || echo "vitaGL not preinstalled"
      - uses: actions/checkout@v4
      - name: vitaGL (if the image lacks it)
        run: |
          if [ ! -f $VITASDK/arm-vita-eabi/lib/libvitaGL.a ]; then
            git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm && cd /tmp/vdpm && ./vdpm vitaShaRK mathneon SceShaccCgExt vitaGL
          fi
      - name: zlib (packed models, if the image lacks it)
        run: |
          if [ ! -f $VITASDK/arm-vita-eabi/lib/libz.a ]; then
            [ -d /tmp/vdpm ] || git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
            cd /tmp/vdpm && ./vdpm zlib
          fi
      - name: Build VPK
        run: |
          cmake -S vita -B build-vita -DCMAKE_BUILD_TYPE=Release -DFL_APP_VER=${{ needs.version.outputs.app }}
          cmake --build build-vita -j4
          ls -la build-vita/*.vpk build-vita/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FormulaLegends-Vita
          path: build-vita/FormulaLegends.vpk
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: FormulaLegends-music
          path: build-vita/FormulaLegends-music.zip
          compression-level: 0

  pc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC test (address + UB sanitizer)
        run: |
          dpkg -s zlib1g-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zlib1g-dev)
          make -f Makefile.pc asan
      - name: Menus
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: mkdir -p shots && ./fl_test_asan menus shots
      - name: The intro
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan intro shots 2>&1 | tail -4
      - name: Headquarters, main menu and showroom
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan hq shots 2>&1 | grep -E "picked|after"
      - name: Eras stay apart (circuits, teams, careers per era)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan eralock x 2>/dev/null | grep -E "^era"
      - name: Main menu touch skip, headquarters theme
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan touchskip x 2>/dev/null | grep -vE "^track"
      - name: No overlaps (barriers, terrain and trackside objects at every circuit)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan overlaps all 2>/dev/null
      - name: One lap at every circuit (each era's cars)
        env:
          ASAN_OPTIONS: detect_leaks=0
          EMR_WX: 1
        run: |
          i=0
          for t in interlagos imola monaco barcelona montreal magnycours hungaroring spa monza suzuka bahrain melbourne sepang shanghai istanbul singapore abudhabi sochi baku redbullring silverstone hockenheim cota mexico jeddah miami zandvoort lasvegas lusail; do
            car=$(( (i % 4) * 10 + (i % 7) )); i=$((i+1))
            ./fl_test_asan race $t $car 1 7 shots 20 | grep -E "^P1 |player" | head -2
          done
      - name: Races with race control (rain, safety car / VSC, pit stops, DRS)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          EMR_WX=3 ./fl_test_asan race spa 2 4 11 shots | grep -E "^P1 |SAFETY|VIRTUAL|Stop|DRS" | head -8
          EMR_WX=1 ./fl_test_asan race bahrain 31 5 11 shots | grep -E "^P1 |DRS|Stop" | head -8
      - name: Time trial (ghost saved and reloaded)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./fl_test_asan timetrial 3 2 3 shots 2>&1 | grep -E "^lap|reload"
      - name: Cars, replay, steering help
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./fl_test_asan cars shots
          ./fl_test_asan replay suzuka shots 2>&1 | grep -E "recorded|did not|back on"
          for h in 0 1; do ./fl_test_asan steer monza $h; done
      - uses: actions/upload-artifact@v4
        with:
          name: pc-test-shots
          path: shots

  # every push to main is released as the next version (or Run workflow with a release tag), with
  # the game and the music pack, once the Vita build and every test have passed
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release != '')
    needs: [version, vita, pc-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes (the changes since the last release, then how to install)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api repos/${{ github.repository }}/releases/latest -q .tag_name 2>/dev/null || true)
          {
            echo "## Formula Legends ${{ needs.version.outputs.tag }}"; echo
            echo "### Changes"
            if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
              git log --no-merges --format='- %s' "$last..HEAD"
            else
              git log --no-merges --format='- %s' -1
            fi
            echo
            sed -n '/^### Install/,/^### In this version/p' RELEASE_NOTES.md | sed '$d'
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          name: FormulaLegends-Vita
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: FormulaLegends-music
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Formula Legends ${{ needs.version.outputs.tag }}
          body_path: notes.md
          make_latest: true
          files: |
            out/FormulaLegends.vpk
            out/FormulaLegends-music.zip
