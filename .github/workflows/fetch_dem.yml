name: Fetch terrain grids
# Run by hand (Actions > Fetch terrain grids > Run workflow): downloads fine elevation grids for the
# named circuits and commits them to the "dem-data" branch (bring tools/tracks/dem/ over from it, then
# run tools/build_tracks.py and tools/pack_files.py DATA/tracks/*.emt)
on:
  workflow_dispatch:
    inputs:
      tracks:
        description: circuit ids, space separated
        default: interlagos spa redbullring
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy scipy
      - run: python3 tools/tracks/fetch_dem.py ${{ github.event.inputs.tracks }}
      - name: commit to dem-data
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b dem-data
          git add tools/tracks/dem
          git commit -m "Terrain grids: ${{ github.event.inputs.tracks }}"
          git push -f origin dem-data
